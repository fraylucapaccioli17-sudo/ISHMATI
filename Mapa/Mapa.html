<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Mapa Interactivo - Estado de Morelos</title>
  <link rel="stylesheet" href="mapa.css">
</head>
<body>

<h1>🗺️ Rompecabezas del Estado de Morelos</h1>

<div class="info">
  <span>⏱️ Tiempo: <span id="tiempo">180</span> s</span>
  <span>🎯 Puntos: <span id="puntos">0</span></span>
  <span>✅ Completados: <span id="completados">0</span>/<span id="total">0</span></span>
</div>

<div class="contenedor">

  <!-- MAPA SVG -->
  <div class="mapa-wrapper">
    <svg viewBox="0 0 900 650" id="mapa" xmlns="http://www.w3.org/2000/svg">
      
      <!-- Fondo del mapa -->
      <rect width="900" height="650" fill="#f0f4e8" rx="10" />
      
      <!-- Título del mapa -->
      <text x="450" y="40" class="mapa-title" text-anchor="middle">ESTADO DE MORELOS</text>

      <!-- ===== MUNICIPIO: CUERNAVACA ===== -->
      <g class="municipio-group">
        <path id="cuernavaca"
          d="M280 180 L360 160 M360 160 L400 200 M400 200 L350 240 M350 240 L280 220 M280 220 L280 180"
          onclick="mostrarPregunta('cuernavaca')" />
        <text x="325" y="210" class="municipio-label" text-anchor="middle">
          <tspan x="325" dy="0">Cuernavaca</tspan>
        </text>
      </g>

        <path id="jiutepec"
          d="M380 210 L460 190 L490 240 L430 270 L380 250 Z"

        <text x="430" y="235" class="municipio-label" text-anchor="middle">Jiutepec</text>

      <g class="municipio-group">
        <path id="ocoyoacac"
          d="M120 300 L200 280 L210 330 L150 360 L120 340 Z"

        <text x="165" y="325" class="municipio-label" text-anchor="middle">Ocoyoacac</text>
      </g>

    </svg>
  </div>

  <!-- PANEL -->
  <div class="panel">
    <h3>🎮 Instrucciones</h3>
    <p>Selecciona un municipio del mapa, responde la pregunta y gana puntos.</p>
    <button class="btn-reiniciar" onclick="reiniciar()">🔄 Reiniciar juego</button>
    <div class="panel-info">
      <p>✅ Verde = Completado</p>
      <p>🟡 Amarillo = Seleccionado</p>
      <p>⚪ Transparente = Pendiente</p>
    </div>
  </div>

</div>

<!-- PREGUNTAS -->
<div id="pregunta" class="pregunta"></div>

<script src="mapa.js"></script>
</body>
</html>
